name: DN WATCH OS APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Create Flutter Project
        run: flutter create --org com.dnwatch --project-name dn_watch_os .

      - name: Fix Kotlin Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle.kts")

          if not p.exists():
              p = Path("android/settings.gradle")

          if not p.exists():
              raise SystemExit("Android settings file not found!")

          s = p.read_text()

          patterns = [
              r'(id\(["\']org\.jetbrains\.kotlin\.android["\']\)\s+version\s+["\'])[^"\']+(["\'])',
              r'(id\s+["\']org\.jetbrains\.kotlin\.android["\']\s+version\s+["\'])[^"\']+(["\'])',
              r'(id\(["\']kotlin-android["\']\)\s+version\s+["\'])[^"\']+(["\'])',
              r'(id\s+["\']kotlin-android["\']\s+version\s+["\'])[^"\']+(["\'])'
          ]

          count = 0

          for pattern in patterns:
              s, n = re.subn(
                  pattern,
                  r'\g<1>2.2.20\g<2>',
                  s
              )
              count += n

          if count == 0:
              raise SystemExit("Kotlin plugin declaration not found!")

          p.write_text(s)
          print("Kotlin plugin updated to 2.2.20")
          PY

      - name: Configure Android SDK and NDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("Android app Gradle file not found!")

          s = p.read_text()

          s = re.sub(
              r'compileSdk\s*=\s*[^ \n]+',
              'compileSdk = 36',
              s
          )

          s = re.sub(
              r'minSdk\s*=\s*[^ \n]+',
              'minSdk = 24',
              s
          )

          s = re.sub(
              r'ndkVersion\s*=\s*[^ \n]+',
              'ndkVersion = "27.0.12077973"',
              s
          )

          p.write_text(s)
          print("Android SDK 36, minSdk 24 and NDK 27 configured.")
          PY

      - name: Add Bluetooth LE Packages
        run: |
          flutter pub add flutter_blue_plus:2.3.14
          flutter pub add permission_handler:12.0.3
          flutter pub add speech_to_text
          flutter pub add flutter_tts

      - name: Add Bluetooth Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found!")

          s = p.read_text()

          marker = "    <application"

          permissions = """    <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
          """

          if "android.permission.BLUETOOTH_SCAN" not in s:
              if marker not in s:
                  raise SystemExit("Application tag not found!")
              s = s.replace(marker, permissions + marker, 1)

          p.write_text(s)
          print("Bluetooth permissions configured.")
          PY

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DN-WATCH-OS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
